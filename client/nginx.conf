map $uri $static_cache_control {
    default "no-cache";
    "~^/assets/.+-[A-Za-z0-9_-]{8,}\.[^/]+$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https:; font-src 'self' data: https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; worker-src 'self' blob:" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $static_cache_control;

    location = /api {
        default_type application/json;
        return 503 '{"error":"API is not configured. Set VITE_API_BASE_URL to the API service URL."}';
    }

    location ^~ /api/ {
        default_type application/json;
        return 503 '{"error":"API is not configured. Set VITE_API_BASE_URL to the API service URL."}';
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
